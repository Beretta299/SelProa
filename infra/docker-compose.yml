name: pitwall

services:
  registry-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports: ["5433:5432"]
    volumes: [registry-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 3s
      timeout: 3s
      retries: 20

  registry-api:
    build:
      context: ../registry-api
      dockerfile: Dockerfile
    environment:
      REGISTRY_API_PORT: 8081
      REGISTRY_DB_URL: jdbc:postgresql://registry-db:5432/registry
      REGISTRY_DB_USER: registry
      REGISTRY_DB_PASSWORD: registry
    ports: ["8081:8081"]
    depends_on:
      registry-db:
        condition: service_healthy

volumes:
  registry-db-data:
