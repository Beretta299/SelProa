name: pitwall

services:
  market-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ["5433:5432"]
    volumes: [market-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 3s
      timeout: 3s
      retries: 20

  market-api:
    build:
      context: ../market-api
      dockerfile: Dockerfile
    environment:
      MARKET_API_PORT: 8081
      MARKET_DB_URL: jdbc:postgresql://market-db:5432/market
      MARKET_DB_USER: market
      MARKET_DB_PASSWORD: market
    ports: ["8081:8081"]
    depends_on:
      market-db:
        condition: service_healthy

volumes:
  market-db-data:
